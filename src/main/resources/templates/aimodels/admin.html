<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      th:replace="~{layout/main :: layout(~{::title}, ~{::section})}">
<head>
    <title>AI Models Admin - DioNext Admin</title>
    <style>
        .json-viewer {
            font-family: monospace;
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            height: 500px;
            overflow: auto;
            white-space: pre;
        }
    </style>
</head>
<body>
    <section>
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>AI Models Administration</h2>
            <div>
                <a th:href="@{/aimodels}" class="btn btn-outline-secondary">Back to List</a>
            </div>
        </div>

        <div class="alert alert-info">
            <p>This page allows you to manage the AI models configuration. The models are loaded from <code>model.json</code> file when the application starts.</p>
        </div>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}">Error message</div>

        <div class="row mb-4">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">Current Models Configuration</h5>
                        <button id="exportBtn" class="btn btn-primary btn-sm">Export Current Models</button>
                    </div>
                    <div class="card-body">
                        <div class="json-viewer" th:text="${jsonContent}">
                            // JSON content will be displayed here
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header">
                        <h5>Export Results</h5>
                    </div>
                    <div class="card-body">
                        <div id="exportResult" class="alert alert-info d-none">
                            <p id="exportMessage"></p>
                            <p id="exportPath" class="mt-2 font-monospace"></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const exportBtn = document.getElementById('exportBtn');
            const exportResult = document.getElementById('exportResult');
            const exportMessage = document.getElementById('exportMessage');
            const exportPath = document.getElementById('exportPath');

            exportBtn.addEventListener('click', function() {
                exportBtn.disabled = true;
                exportBtn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Exporting...';
                
                fetch('/aimodels/admin/export')
                    .then(response => response.json())
                    .then(data => {
                        exportResult.classList.remove('d-none', 'alert-danger');
                        exportResult.classList.add('alert-success');
                        exportMessage.textContent = data.message;
                        exportPath.textContent = 'File path: ' + data.filePath;
                    })
                    .catch(error => {
                        exportResult.classList.remove('d-none', 'alert-success');
                        exportResult.classList.add('alert-danger');
                        exportMessage.textContent = 'Error exporting models: ' + error.message;
                        exportPath.textContent = '';
                    })
                    .finally(() => {
                        exportBtn.disabled = false;
                        exportBtn.innerHTML = 'Export Current Models';
                    });
            });
        });
    </script>
</body>
</html>
